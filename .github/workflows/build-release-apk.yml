name: Build Release APK (universal)

on:
  workflow_dispatch:   # run manually from the Actions tab

permissions:
  contents: write   # lets the first run commit the encrypted signing key

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 0   # the build derives versionName from git history
    - name: JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    - name: Make gradlew executable
      run: chmod +x gradlew
    - name: Prepare signing key
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        SIGNING_PASSPHRASE: ${{ secrets.SIGNING_PASSPHRASE }}
      run: |
        set -e
        if [ -n "$KEYSTORE_BASE64" ]; then
          # option A: keystore supplied through four secrets
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          SP="$KEYSTORE_PASSWORD"; KA="$KEY_ALIAS"; KP="$KEY_PASSWORD"
        elif [ -n "$SIGNING_PASSPHRASE" ]; then
          # option B: one secret. the keystore is created on the first run, encrypted with the
          # passphrase and committed (signing/release.jks.enc); later runs decrypt it.
          if [ ! -f signing/release.jks.enc ]; then
            echo "No signing key yet: creating one"
            keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/release.jks" \
              -alias rethink -keyalg RSA -keysize 4096 -validity 10000 \
              -storepass "$SIGNING_PASSPHRASE" -keypass "$SIGNING_PASSPHRASE" \
              -dname "CN=Rethink fork, O=personal, C=US"
            mkdir -p signing
            openssl enc -aes-256-cbc -pbkdf2 -iter 600000 -salt \
              -pass env:SIGNING_PASSPHRASE -in "$RUNNER_TEMP/release.jks" -out signing/release.jks.enc
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add signing/release.jks.enc
            git commit -m "Add encrypted release signing key"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 \
              -pass env:SIGNING_PASSPHRASE -in signing/release.jks.enc -out "$RUNNER_TEMP/release.jks"
          fi
          SP="$SIGNING_PASSPHRASE"; KA="rethink"; KP="$SIGNING_PASSPHRASE"
        else
          echo "::error::Add the secret SIGNING_PASSPHRASE (or the four KEYSTORE_* secrets)."
          exit 1
        fi
        {
          echo "storeFile=$RUNNER_TEMP/release.jks"
          echo "storePassword=$SP"
          echo "keyAlias=$KA"
          echo "keyPassword=$KP"
        } > keystore.properties
    - name: Build signed release APK (F-Droid flavor, no Google services needed)
      run: ./gradlew assembleFdroidFullRelease --warning-mode all
    - name: Remove key material
      if: always()
      run: rm -f keystore.properties "$RUNNER_TEMP/release.jks"
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: rethink-wg-socks5-release-apk
        path: app/build/outputs/apk/**/*universal*.apk
        if-no-files-found: error
